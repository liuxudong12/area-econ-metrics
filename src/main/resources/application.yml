server:
  port: 8080

spring:
  application:
    name: area-econ-metrics

  # ============================================================
  # Day 9：文件上传限制
  # ============================================================
  # ⚠️ Spring Boot 默认的 max-file-size 只有 **1MB**，max-request-size 是 10MB。
  #    1 万行的 xlsx 大约 287KB，还不会撞上；但 5 万行就会超过 1MB，
  #    报错长这样：MaxUploadSizeExceededException: Maximum upload size exceeded。
  #    这个坑的特点是"小文件测试永远发现不了，一上真实数据就炸"。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      # 超过这个阈值才写磁盘临时文件（默认 0 = 一律写磁盘）。
      # 小文件直接在内存里处理，省一次磁盘 IO。
      file-size-threshold: 1MB

  # ============================================================
  # Day 7：Redis 缓存配置
  # ============================================================
  # ⚠️ 配置路径的坑（Spring Boot 2 → 3 的一处破坏性变更）：
  #   Spring Boot 2.x： spring.redis.host
  #   Spring Boot 3.x： spring.data.redis.host   ← 多了 .data 这一层
  # 写成老路径不会报错，只是**配置完全不生效**，然后连到默认的 localhost:6379。
  # 本地刚好也是 localhost:6379，所以你甚至发现不了 —— 但换成服务器地址就崩了。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 用哪个库（0~15）。不同库之间的 key 互相看不见，可以用 SELECT 切换。
      # 本地练习用 0 就行；真项目常按用途分库，比如 0 放业务缓存、1 放会话。
      database: 0
      # 连接超时。Redis 是内存数据库，正常响应在 1ms 以内，
      # 设 3 秒是"实在连不上就别死等"的保护，避免请求线程被拖死。
      timeout: 3000ms
      lettuce:
        pool:
          # 最大连接数（正在被使用的 + 空闲的，上限）
          max-active: 16
          # 最大空闲连接数（空闲连接超过这个数会被回收）
          max-idle: 8
          # 最小空闲连接数（低于它就提前建好，避免"用到时才建"的抖动）
          min-idle: 2
          # 池里没连接可用时，最多等多久。给 2000ms 是为了**快速失败**，
          # 而不是无限等待把 Tomcat 线程全占满。
          max-wait: 2000ms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 参数一个都不能少：
    #   useUnicode + characterEncoding  → 中文不乱码
    #   serverTimezone=Asia/Shanghai    → 否则时间差 8 小时（MySQL 8 经典坑）
    #   useSSL=false                    → 本地不需要加密连接
    #   allowPublicKeyRetrieval=true    → MySQL 8 默认认证插件是 caching_sha2_password，
    #                                     不加这个会报 Public Key Retrieval is not allowed
    url: jdbc:mysql://localhost:3306/area_econ?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root@1234

# MyBatis-Plus 配置（第 2-3 天开始用到）
mybatis-plus:
  # Mapper XML 文件的位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类所在包，开启后 Mapper 不用再写 @Mapper 注解也能被扫描到
  type-aliases-package: com.liuxudong.areaecon.entity
  configuration:
    # 数据库下划线字段（region_code）自动映射到 Java 驼峰属性（regionCode）
    map-underscore-to-camel-case: true
    # 把执行的 SQL 打印到控制台 —— 学习阶段强烈建议开着，能看清每一步查了什么
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：@TableLogic 识别 deleted 字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别：方便看自己写的 SQL 和参数
logging:
  level:
    com.liuxudong.areaecon: debug

# ============================================================
# Day 9：Excel 异步导入
# ============================================================
# 这些值都做成配置项，而不是写死在代码里的常量 —— 理由：
#   ① 不同环境（本地 / 测试 / 生产）目录和限制不一样；
#   ② 调参不用改代码、不用重新打包；
#   ③ 面试时说"这些都是可配置的，配合配置中心能热更新"是加分项。
stat:
  import:
    # 上传文件的落地目录。异步任务在后台要靠这个路径重新读文件，
    # 所以**文件必须持久化**，不能只放在 MultipartFile 里（请求一结束它就没了）。
    dir: ./data/import
    # 单次导入允许的最大行数。防"有人传了个 100 万行的表"把数据库拖垮。
    max-rows: 50000
    # 批量插入的批大小。500 是经验值：够大（减少往返次数）又不会让单条 SQL 过长。
    batch-size: 500

    # ============================================================
    # Day 11：错误行明细
    # ============================================================
    # 一个任务最多记录多少条错误明细。
    #
    # 为什么要有上限：一个 10 万行全错的文件，如果不限，会给数据库灌 10 万条错误日志，
    # 而且用户面对 10 万条错误也修不过来（这种文件应该重做，不是修）。
    #
    # 超过上限后：只统计数量（async_task.error_rows 仍是真实总数），
    # 不再记明细，接口返回 errorRows > recordedRows，前端提示"仅记录前 N 条"。
    #
    # 注意：改这个值不影响已有数据，只影响之后的任务。
    max-error-rows: 10000

    # ============================================================
    # Day 10：失败重试（指数退避）
    # ============================================================
    retry:
      # 最多重试几次（不含首次执行）。3 次 → 总共最多跑 4 遍。
      # 为什么不是 10 次？因为退避是指数增长的：1+2+4+8+16+32+64... 用户等不起。
      # 重试次数上限本质上是"用户愿意等多久"的产品问题，不是技术问题。
      max-retry: 3
      # 退避时间表（秒），逗号分隔，会注入成 long[]。
      # 第 1 次失败等 1 秒，第 2 次等 2 秒，第 3 次等 4 秒。
      # 真实项目常见 1,2,4,8,16,32,60（封顶 60 秒），避免等待时间无限膨胀。
      backoff-seconds: 1,2,4
      # 调度器多久扫一次库。500ms 是为了让"1 秒退避"实测误差不超过 0.5 秒。
      # 生产环境可以放到 1~5 秒 —— 重试本身就不是对延迟敏感的操作，
      # 扫得太勤只是白白增加数据库压力。
      scan-interval-ms: 500
      # RUNNING 状态多久没更新就判定为僵尸任务（秒）。
      # ⚠️ 这个值必须明显大于"最大文件正常导入耗时"，否则会误杀正在跑的任务。
      #    实测 1 万行约 1 秒，5 万行（上限）约 5 秒，300 秒有 60 倍余量。
      #    真实项目里长任务（比如导出百万行报表）需要**定期更新心跳**，
      #    不能只靠"最后一次状态变更时间"，否则一定会误杀。
      zombie-timeout-seconds: 300
      # 每轮最多捞多少条。防止积压几万条时一次全捞出来把内存撑爆。
      batch-limit: 20
      # 线程池满时，任务退回等待多少秒（不消耗重试次数）
      requeue-delay-seconds: 30

    # ============================================================
    # Day 10 实验专用：故障注入
    # ============================================================
    # 跑到第 N 批写库时强制抛异常，用来复现"前 N-1 批已落库、第 N 批断了"的场景。
    # -1 = 关闭（默认）。生产环境必须保持 -1。
    # 实验用法见 docs/00-第10天操作手册.md 的"实验 A/B"。
    test:
      fail-at-batch: -1

# ============================================================
# ⚠️ 注意：这只是本地练习库的密码，直接写在这里没问题。
#    但真项目里数据库密码绝不能提交到 Git。做法二选一：
#      1) 放到环境变量：password: ${DB_PASSWORD}
#      2) 新建 application-local.yml 写密码，并加进 .gitignore
# ============================================================
