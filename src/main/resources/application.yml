server:
  port: 8080

spring:
  application:
    name: area-econ-metrics

  # ============================================================
  # Day 7：Redis 缓存配置
  # ============================================================
  # ⚠️ 配置路径的坑（Spring Boot 2 → 3 的一处破坏性变更）：
  #   Spring Boot 2.x： spring.redis.host
  #   Spring Boot 3.x： spring.data.redis.host   ← 多了 .data 这一层
  # 写成老路径不会报错，只是**配置完全不生效**，然后连到默认的 localhost:6379。
  # 本地刚好也是 localhost:6379，所以你甚至发现不了 —— 但换成服务器地址就崩了。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 用哪个库（0~15）。不同库之间的 key 互相看不见，可以用 SELECT 切换。
      # 本地练习用 0 就行；真项目常按用途分库，比如 0 放业务缓存、1 放会话。
      database: 0
      # 连接超时。Redis 是内存数据库，正常响应在 1ms 以内，
      # 设 3 秒是"实在连不上就别死等"的保护，避免请求线程被拖死。
      timeout: 3000ms
      lettuce:
        pool:
          # 最大连接数（正在被使用的 + 空闲的，上限）
          max-active: 16
          # 最大空闲连接数（空闲连接超过这个数会被回收）
          max-idle: 8
          # 最小空闲连接数（低于它就提前建好，避免"用到时才建"的抖动）
          min-idle: 2
          # 池里没连接可用时，最多等多久。给 2000ms 是为了**快速失败**，
          # 而不是无限等待把 Tomcat 线程全占满。
          max-wait: 2000ms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 参数一个都不能少：
    #   useUnicode + characterEncoding  → 中文不乱码
    #   serverTimezone=Asia/Shanghai    → 否则时间差 8 小时（MySQL 8 经典坑）
    #   useSSL=false                    → 本地不需要加密连接
    #   allowPublicKeyRetrieval=true    → MySQL 8 默认认证插件是 caching_sha2_password，
    #                                     不加这个会报 Public Key Retrieval is not allowed
    url: jdbc:mysql://localhost:3306/area_econ?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root@1234

# MyBatis-Plus 配置（第 2-3 天开始用到）
mybatis-plus:
  # Mapper XML 文件的位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类所在包，开启后 Mapper 不用再写 @Mapper 注解也能被扫描到
  type-aliases-package: com.liuxudong.areaecon.entity
  configuration:
    # 数据库下划线字段（region_code）自动映射到 Java 驼峰属性（regionCode）
    map-underscore-to-camel-case: true
    # 把执行的 SQL 打印到控制台 —— 学习阶段强烈建议开着，能看清每一步查了什么
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：@TableLogic 识别 deleted 字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别：方便看自己写的 SQL 和参数
logging:
  level:
    com.liuxudong.areaecon: debug

# ============================================================
# ⚠️ 注意：这只是本地练习库的密码，直接写在这里没问题。
#    但真项目里数据库密码绝不能提交到 Git。做法二选一：
#      1) 放到环境变量：password: ${DB_PASSWORD}
#      2) 新建 application-local.yml 写密码，并加进 .gitignore
# ============================================================
